<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            box-sizing: border-box;
            border: 2px solid black;
            /* width: 2048px; */
            width: 80vw;
            height: 40vh;
            margin: auto;
            background: aquamarine;
            font-size: 45px;
           /* vw- viewport width vh- viewport height

/* 1 Inch = 1/196 pixel*/
        }
        .container{
            box-sizing: border-box;
            border: 2px solid black;
            /* width: 2048px; */
            width: 80vw;
            height: 80vh;
            margin: 23px auto;
            background: aquamarine;
            font-size: 2em;
            /* Default font size is 16px  And 2em means 32px 3em means 48px
            rem is n times of root element size*/

        }
        .mycont{
            box-sizing: border-box;
            margin: 23px auto;
            color: black;
            border: 2px solid black;
            font-size: 22px;
            width: 80vmin;
            min-height: 80vh;
            background-color: antiquewhite;
            /* vmin is height for display and vmin is width in phone*/
        }
    </style>
</head>
<body>
    <div class="box">
 This is a box
    </div>
    <div class="container">Lorem ipsum dolor sit amet, consectetur adipisicing elit. Rem accusantium aut voluptatum, eius laborum eaque dolor, aperiam in quod sint obcaecati natus voluptas?
    </div>
    <div class="mycont">I am another Container.</div>
</body>
</html>
