<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Design</title>
    <style>
        .button{
            text-align: center;
            padding: 
        }
        .button button{
            padding: 8px;
            border-radius: 15px;
            background-color: lightblue;
            color: blue;
            font-size: 12px;
            border: none;
            cursor: pointer
        }
        .button button:hover{
            background-color: lightcoral
        }
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
        *{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: gray;
        }
        .card{
            background-color: white;
            width: 198px;
            height: 620px;
            border-radius: 3px;
        }
        .image{
        padding: 5px;
        border-radius: 5px;
        }
        .capsules{
            padding: 0 px 0 34px;
        }
        .capsules span{
            border: 1px solid grey;
            padding: 1px 9px;
            border-radius: 7px;
        }
        .content{
            padding: 10px;
            font-family: "Poppins", sans-serif;
        }
        .content p{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            color: grey;
        }
        .content H1{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 27px;
           
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="image"> <img width="188"px src="https://img.freepik.com/free-photo/view-boat-floating-water-with-nature-scenery_23-2150693348.jpg?t=st=1719655840~exp=1719659440~hmac=b19d81c55a3250b7e7406c350ca10ddfa9eb5fd9f0bacc97219d730427a3ddb2&w=360" alt=""></div>
        <div class="capsules">
            <span>Nature</span>
            <span>Lake</span>
        </div>
        <div class="content">
            <H2>Mohan Gupta</H1>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Excepturi corrupti voluptates iure porro aspernatur. Dolor commodi nostrum architecto at ea tenetur amet similique.</p>
        </div>
        <div class="button">
            <button>Read More
            </button>
        </div>
    </div>
</body>
</html>
