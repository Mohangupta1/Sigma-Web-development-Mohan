<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Multicolor Website </title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
        </style>
    <style> 
    /* :root{
        --primary-color:#8080d0;
        --text-color: white;
        --secondary-color:#8282ff;
    } */
    :root{
        --primary-color:#060502a0;
        --text-color: white;
        --secondary-color:#b2c727;
        *{
            margin: 0;
            padding:0;
            font-family: 'poppins',sans-serif;
        
        }
        body{
            background-color: var(--primary-color);
        }
        ul li{
            list-style: none;
            display: inline;
            padding: 3px;
            font-weight: 400px;
            color: white;
        }
        nav{
            background-color: var(--secondary-color);
            padding: 12px 0px;
            color: var(--text-color);
            
        }
        ul li a{
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/">About</a></li>
                <li><a href="/">Services</a></li>
                <li><a href="/">Contacts </a> </li> <!--Alt+Shift+ down arrow key for copy-->
            <!--Use Alt key to have cursor at multiline and shift to select all-->
    
            </ul>
        </nav>
    </header>
    
</body>
</html>
