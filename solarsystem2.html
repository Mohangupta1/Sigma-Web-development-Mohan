<!DOCTYPE html>
<html>
<head>
    <title>Solar System</title>
    <style>
        body {
            background-color: black;
            overflow: hidden;
        }

        .sun {
            width: 100px;
            height: 100px;
            background-color: #ffdb58;
            border-radius: 50%;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50-->
        
        .planet {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            position: absolute;
        }
        <!-- for the margin style and for marginal gap and for marginal copy  and playing and making games and making play and jkl; adf jkl adf jkl; adsf jkl asdf jkl; a;dsf jk;l adf jasdf jkl asdf jkjl; asdf jkl fyou are fr-->

        .mercury {
            background-color: #c0c0c0;
            animation: orbit-mercury 4s linear infinite;
        }

        .venus {
            background-color: #ffab40;
            animation: orbit-venus 8s linear infinite;
        }

        .earth {
            background-color: #3774e5;
            animation: orbit-earth 12s linear infinite;
        }

        .mars {
            background-color: #ff6243;
            animation: orbit-mars 20s linear infinite;
        }

        @keyframes orbit-mercury {
            0% {
                transform: translateX(100px);
            }
            100% {
                transform: translateX(100px) rotate(360deg);
            }
        }

        @keyframes orbit-venus {
            0% {
                transform: translateX(150px);
            }
            100% {
                transform: translateX(150px) rotate(360deg);
            }
        }
 
        @keyframes orbit-earth {
            0% {
                transform: translateX(200px);
            }
            100% {
                transform: translateX(200px) rotate(360deg);
            }
        }

        @keyframes orbit-mars {
            0% {
                transform: translateX(260px);
            }
            100% {
                transform: translateX(260px) rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="sun"></div>
    <div class="planet mercury"></div>
    <div class="planet venus"></div>
    <div class="planet earth"></div>
    <div class="planet mars"></div>
</body>
</html>
