<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            border: 2px solid black;
            padding: 44px;
            margin: 32px;
            box-shadow: 5px 5px 15px 5px #cffc06;
        }
        .text-element{
            text-shadow: 2px 2px 4px #cffc06;
            outline: solid black;
            border: solid blue;
            border-radius: 2px;
            outline-offset: 2px;

        }
    </style>
</head>
<body>
    <div class="box">I am a box</div>
    <p class="text-element">Lorem ipsum dolor sit amet consectetur adipisicing elit. Nesciunt sapiente labore eligendi!</p>
</body>
</html>
