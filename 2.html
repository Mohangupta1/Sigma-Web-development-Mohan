<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS selectors</title>
    <style>
        /* Element Selector*/
        div{
            background-color: red;
        }
        /* Class selector use .for class*/
       .one{
        background-color: yellow;
       }
       /* id selector use # for id */
       #green{
        background-color: green;
       }
       /* child selector */
       div p {
       background-color: gray
        color;
       }
       /* descandant selector */
       div p {
        color: violet;
        background-color: pink;
       }

       /* universal selecor */
       *{
        margin: 0;
        padding: 0;
       }
       /* pseudo selector */
       a:visited{
        color: red;
       }
       a:link{
        color: green;
       }
       a:active{
        background-color: red;
       }
      a:hover{
        background-color: brown;
      }
      p:first-child{
        background-color: yellow;
      }
      
    

    </style>
</head>
<body>
    <div class="one"> I am selector</div>
    <div class="one">
        I am div
        <article>

            <p>I am para inside div</p>
        </article>
</div>
    <div>I am 2nd div</div>
    <div id="green">I am 3rd div</div>
    <a href="https://www.google.com">Go to Google</a>
    <a href="https://www.facebook.com">Go to facebook</a>
<main>
    <p>I am first</p>
    <p>I am second</p>
</main>
</body>

</html>
