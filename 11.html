<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Posittion Property</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
.box{
    border: 2px solid black;
    height: 133px;
    padding: 3px;
    margin: 3px;
    width: 80vw;
}
.box1{
    background-color: aqua;
    position: sticky;
    top:0px;
    top: 1px;
    
}
.box2{
    background-color: pink;
    
}
.box3{
    background-color: purple;

}
.box4{
    background-color: red;
    position: relative;
    bottom: 25px;
    left:23px;
}
.parent{
    /* Exception: Transform,filter, or perspective properties can also make an element appear as positioned */
    /* transform: translate(0); */
    /* filter: invert(0); */
    /* perspective: 0em; */
    margin: 43px;
    padding:34px;
border: 2px solid purple;
position: absolute;
}
    </style>
</head>
<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
        

    </div>
</body>
</html>
<!-- summary:
 Relative: Apni original position se change hogi
 Absolute: Apne parent ke relative position change hogi
 Fixed: page mein position fixed hogi
 Sticky: page mein kagin bhi ho,scroll krne pr neeche nhi jayegi -->
